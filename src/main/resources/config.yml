# ==================================================
# SUPREMECHAT PLUGIN
# If you're in need of support or have encounted any errors please join the discord server:
# https://discord.gg/AnPwty8asP
#
# - PlaceholderAPI Support
# - Vault Support
# ==================================================

# The plugin prefix. Used everywhere the %prefix% placeholder appears.
# Supports & color codes and hex colors (&#RRGGBB).
prefix: '&#00ff94&lSupremeChat ➟ '

# ==================================================
# ANTI-BOT
#
# what this does if true?
# - prevents from chatting on join until player moves.
# - prevents from using commands on join until player moves.
# ==================================================
anti-bot:
  chat: true
  commands: true
  message: '&c&lPrevention &8&l➟ &7Please move before performing this.'

# mute chat settings
mute-chat: false
bypass-mute-chat-permission: 'supremechat.bypass.mutechat'
ops-bypass-mute-chat: true
# chat color permission (Allow players to use &0-f & hex colors in chat)
chat-color-permission: 'supremechat.chat.color'

# ==================================================
# PLUGIN MESSAGES
#
# Every message the plugin writes directly to players is configurable here.
# Supports & color codes, hex colors and %prefix% (replaced with the plugin prefix).
# Set any message to '' (empty) to send nothing.
# ==================================================
messages:
  # shown when a player lacks permission to run a command
  no-permission: '&cNo Permission!'
  # shown to the player after /supremechat reload
  reload: '%prefix%&7Reloaded config files.'
  # shown to a muted player when they try to chat while chat is muted
  chat-muted: '&cChat is currently muted!'

  # --- MUTE CHAT ( /supremechat mutechat ) ---
  mutechat:
    # broadcast to everyone when the chat gets muted
    enabled: '&c[CHAT] Chat is now muted!'
    # broadcast to everyone when the chat gets un-muted
    disabled: '&c[CHAT] Chat no longer muted!'

  # --- CLEAR CHAT ( /supremechat clearchat ) ---
  clearchat:
    # how many empty lines are sent to wipe each player's screen
    lines: 100
    # set false to clear the chat silently (no broadcast message)
    broadcast-enabled: true
    # broadcast shown to everyone after the chat is cleared. %player% = who cleared it
    broadcast: '%prefix%&7Chat has been cleared by &e%player%&7.'
    # players with this permission keep their chat (their screen is NOT cleared)
    bypass-permission: 'supremechat.bypass.clearchat'

  # --- CHANNELS ( /channel ) ---
  channels:
    # shown when the whole channel system is disabled (channels-enabled: false)
    disabled: '%prefix%&cThe channel system is currently disabled.'
    # /channel leave while not in a channel
    not-in-channel: '&e&lChannel &8&l➟ &cYou are not in a channel.'
    # /channel leave success. %channel% = channel name
    left: '&e&lChannel &8&l➟ &7You have left channel: &e%channel%'
    # /channel list. %channels% = comma separated list
    list: '&e&lAvailable Channels &8&l➟ &e%channels%'
    # shown inside the list when the player has access to no channels
    list-empty: '&cNo channels found for you!'
    # /channel join <name> - channel does not exist
    not-exist: '&e&lChannel &8&l➟ &cThis channel does not exist.'
    # /channel join <name> - no permission for that channel
    no-permission-join: '&e&lChannel &8&l➟ &cYou do not have permission to join this channel.'
    # /channel join <name> - already in that channel
    already-in: '&e&lChannel &8&l➟ &cYou are already in this channel.'
    # /channel join <name> - success. %channel% = channel name
    joined: '&e&lChannel &8&l➟ &7You have been added to %channel% channel!'
    # text shown for %channel% in the info menu when the player is in no channel
    none: '&c&lNONE'
    # /channel (or /channel help) info menu. %channel% = current channel (or 'none' above)
    info:
      - '&6&l> &7You are in channel: &e&l%channel%'
      - '&6&l> &f/channel join <name> &7- To switch channel!'
      - '&6&l> &f/channel list &7- List all available channels!'
      - '&6&l> &f/channel leave &7- To leave the channel you are in!'

  # --- MSGTOGGLE ( /msgtoggle ) - available to everyone ---
  msgtoggle:
    # shown to the player when they turn private messages OFF
    now-blocking: '%prefix%&7You are now &cblocking&7 private messages.'
    # shown to the player when they turn private messages ON
    now-receiving: '%prefix%&7You are now &areceiving&7 private messages.'
    # shown to a sender trying to message someone who disabled private messages
    target-disabled: '&cThat player has private messages disabled.'

  # --- IGNORE ( /ignore <player> ) - available to everyone ---
  ignore:
    # %player% = the ignored player's name
    now-ignoring: '%prefix%&7You are now ignoring &e%player%&7.'
    no-longer-ignoring: '%prefix%&7You are no longer ignoring &e%player%&7.'
    cannot-ignore-self: '&cYou cannot ignore yourself.'
    usage: '&cUsage: /ignore <player>'
    # shown to a sender trying to message a player who is ignoring them
    target-ignores-you: '&cYou cannot message this player.'

  # --- ADMIN CHAT ( /ac <message> ) ---
  adminchat:
    usage: '&cUsage: /ac <message>'

  # --- HELP MENU ( /supremechat ) ---
  # set false to completely disable the help menu shown on /supremechat
  # (useful if you reworked the plugin and don't want the default help)
  help-enabled: false
  # each line is sent to the player. supports %prefix% and %version%
  help:
    - '%prefix%&7Help Message:'
    - ''
    - '&6/supremechat reload &7- reload the plugin config.'
    - '&6/supremechat mutechat &7- mutes the chat for everyone.'
    - '&6/supremechat clearchat &7- clears the chat for everyone.'
    - '&6/supremechat discordsrv &7- DiscordSRV integration debug report.'
    - ''
    - '&#fdc269Author: &#fff2ccDevScape'
    - '&#fdc269Plugin Version: &#fff2cc%version%'
    - '&#fdc269ScapeHelp Server: &#fff2cchttps://discord.gg/AnPwty8asP'

# ==================================================
# CHAT FORMATTING:
#
# format - globally
# groups - Uses VaultAPI Groups to check what rank the player is.
#  * set `group-formatting` to `true` to enable groups.
# ==================================================

# should you want SupremeChat's chat function disabled?
enable-chat-format: true

# debug mode - set to true to see detailed chat formatting logs in console (useful for troubleshooting)
debug-mode: false

# worlds that the chat format will not be used in.
disabled-worlds:
  - "exampleworld"
  - "example2"

# globally be used for everyone if `group-formatting` is set to `false`.
# global-chat-color = Is used for emojis suffix, this prevents players from using the emojis color to bypass chat color permissions.
# format = Global format style that chat will follow.
global-chat-color: '&7'
format: '&7%name% &8➟ &7%message%'

group-formatting: false
groups:
  default: '%vault_prefix%&7%name% &8➟ &7%message%'
  vip: '%vault_prefix%&7%name% &8➟ &a%message%'
  helper: '%vault_prefix%&7%name% &8➟ &e%message%'
  mod: '%vault_prefix%&7%name% &8➟ &b%message%'
  admin: '%vault_prefix%&7%name% &8➟ &c%message%'
  owner: '%vault_prefix%&7%name% &8➟ &c%message%'

# per world chat
# only players in the same world can chat to each other.
per-world-chat: false

hover: # used when you hover over the chat sent by player
  enable: true
  string:
    - '&8&m---------------'
    - '&7World: &b%world%'
    - '&7Rank: %vault_prefix%'
    - '&8&m---------------'
click: # used when you click on the chat sent by player
  enable: true
  # Type of click action:
  #   suggest_command - Pre-fills the chat input (player can edit before sending)
  #   run_command - Executes command immediately
  #   open_url - Opens URL in player's browser
  type: 'suggest_command'
  # Value supports all PlaceholderAPI placeholders
  value: '/msg %player_name% '
  # Note: 'string' is deprecated but still supported for backward compatibility
  # Examples:
  #   type: 'suggest_command', value: '/msg %player_name% ' - Pre-fill private message
  #   type: 'run_command', value: '/profile %player_name%' - View player profile instantly
  #   type: 'open_url', value: 'https://stats.yourserver.com/player/%player_uuid%' - Open web stats

# ==================================================
# PRIVATE MESSAGES (PM):
#
# SupremeChat now handles /msg, /tell, /whisper (/w), /reply (/r)
# With full formatting support including hover, click events, and placeholders!
# ==================================================
private-messages:
  enable: true # Enable/disable SupremeChat's private message system

  # Message formats
  format:
    # What the sender sees when they send a message
    sender: '&d&l[You &8➟ &d&l%receiver_name%&d&l] &f%message%'
    # What the receiver sees when they get a message
    receiver: '&d&l[%sender_name% &8➟ &d&lYou] &f%message%'

  # Hover event when you hover over a private message
  hover:
    enable: true
    string:
      - '&8&m---------------'
      - '&7Player: &d%player_name%'
      - '&7World: &b%world%'
      - '&7Click to reply'
      - '&8&m---------------'

  # Click event when you click on a private message
  click:
    enable: true
    type: 'suggest_command' # suggest_command, run_command, or open_url
    value: '/msg %player_name% ' # Pre-fills chat to reply

  # Social Spy - allows staff to see all private messages
  social-spy:
    enable: false
    permission: 'supremechat.socialspy'
    format: '&8[&7SPY&8] &d%sender_name% &7→ &d%receiver_name%&7: &f%message%'

  # Error messages
  disabled-message: '&cPrivate messages are currently disabled.'
  player-not-found: '&cPlayer &e%player% &cis not online.'
  cannot-message-self: '&cYou cannot send a message to yourself.'
  no-reply-target: '&cYou have no one to reply to.'
  reply-target-offline: '&cThat player is no longer online.'
  # shown when a non-player (e.g. console) tries to use /msg or /reply
  only-players: '&cThis command can only be used by players.'
  # usage messages. %label% = the command alias that was used
  usage-message: '&cUsage: /%label% <player> <message>'
  usage-reply: '&cUsage: /%label% <message>'

# ==================================================
# ADMIN / STAFF CHAT ( /ac <message> )
#
# Broadcasts to everyone holding the permission below (plus console).
# ==================================================
admin-chat:
  # set false to disable the /ac command entirely
  enable: true
  # permission required to send AND receive admin chat
  permission: 'supremechat.adminchat'
  # message format. %name% = sender name, %message% = the message
  format: '&c&l[AdminChat] &f%name% &8➟ &c%message%'
  # name shown when the console uses /ac
  console-name: 'Console'

# ==================================================
# CHANNELS:
# ==================================================
# channels-enabled = Master switch for the WHOLE channel system.
#   Set to false to disable channels entirely (command + chat), regardless of
#   the per-channel 'enable' options below.
# enable = Weather or not you want this channel to register on server load or plugin reload.
# permission = Giving the channel a permission will not allow players without it join, Use None for all access.
# chat-color = Is used for emojis suffix, this prevents players from using the emojis color to bypass chat color permissions.
# format = The main format that will be used when sending to channel members.
channels-enabled: true
channels:
  english:
    enable: true
    permission: None
    chat-color: '&7'
    format: '&e[ENGLISH] &7%name% &8➟ &7%message%'
  spanish:
    enable: true
    permission: None
    format: '&e[SPANISH] &7%name% &8➟ &7%message%'
  french:
    enable: true
    permission: None
    chat-color: '&7'
    format: '&e[FRENCH] &7%name% &8➟ &7%message%'
  staff:
    enable: true
    permission: "supremechat.channel.staff"
    chat-color: '&7'
    format: '&d&l[Staff] &f%name% &8➟ &d%message%'
  admin:
    enable: true
    permission: "supremechat.channel.admin"
    chat-color: '&7'
    format: '&c&l[Admin] &f%name% &8➟ &c%message%'

# ==================================================
# JOIN & LEAVE:
#
# To add a "silent" join type put the custom options to empty ''
# Example: global-format: ''
# ==================================================

join:
  enable: true
  enable-groups: false
  global-format: '&8[&a&l+&8] &7%name%' # will be used if 'enable-groups' is false.
  groups:
    default: '&8[&a&l+&8] &7%name%'
    vip: '&8[&a&l+&8] &7%name%'
    helper: '&8[&a&l+&8] &7%name%'
    mod: '&8[&a&l+&8] &7%name%'
    admin: '&8[&a&l+&8] &7%name%'
    owner: '&8[&a&l+&8] &7%name%'

leave:
  enable: true
  enable-groups: false
  global-format: '&8[&c&l-&8] &7%name%' # will be used if 'enable-groups' is false.
  groups:
    default: '&8[&c&l-&8] &7%name%'
    vip: '&8[&c&l-&8] &7%name%'
    helper: '&8[&c&l-&8] &7%name%'
    mod: '&8[&c&l-&8] &7%name%'
    admin: '&8[&c&l-&8] &7%name%'
    owner: '&8[&c&l-&8] &7%name%'

vanish-support: true # allow to join/leave silent if vanished.

enable-join-motd: true # should 'motd' be enabled.

# executed when a player first joins
first-join:
  enable: true
  announce-format: '&b⛏ &7Welcome &b{USERNAME}&7 to the server! &8[&b{UNIQUE}&8]'

# custom title shows when the player joins the game.
custom-title-join:
  # should custom title join be disabled/enabled.
  enable: true
  top: "&e&lSERVER"
  bottom: "&aWelcome &e%name%"
  fade-in: 1
  stay: 3
  fade-out: 1

motd:
  - '&8&m----------------------------'
  - '&#ca04fb&lY&#d006e2&lO&#d509c9&lU&#db0bb0&lR&#e10e97&lS&#e6107e&lE&#ec1365&lR&#f2154c&lV&#f71833&lE&#fd1a1a&lR'
  - '&#C3C3C3Welcome to the server, %name%!'
  - ''
  - '&#FDB600This is the example MOTD'
  - ''
  - '&7&OSupremeChat by DevScape, thanks for using..'
  - '&8&m----------------------------'

# ==================================================
# CUSTOM COMMANDS:
#
# <command_label>:
#  string: '<your message here that will send to the player>'
#
# Custom commands will be extended soon...
# ==================================================

custom-commands:
  discord: # discord name is your command label.
    string: '&9&lDiscord: &7discord.gg/yourserver'
  store: # store name is your command label.
    string: '&b&lStore: &7store.yourserver.com'

# ==================================================
# MENTION
# ==================================================

mention:
  # mention a single player, e.g. "@Steve"
  player:
    permission: 'supremechat.mention.player'
    target: '@'
    replacement: '&e%target%'
    spaces: true
    sound:
      enable: true
      sound: 'ENTITY_PLAYER_LEVELUP'
  # mention everyone online, e.g. "@everyone"
  # requires the permission below.
  everyone:
    permission: 'supremechat.mention.everyone'
    target: '@everyone'
    replacement: '&c@everyone'
    spaces: true
    sound:
      enable: true
      sound: 'ENTITY_PLAYER_LEVELUP'

# ==================================================
# CHAT FILTER:
#
# set `chat-delay` to 0 if you want to disable chat delay.
# ==================================================

word-detect-enable: true
# If true, replaces banned words with asterisks (***) instead of blocking the entire message
# Example: "hello badword" becomes "hello *******"
# If false, blocks the entire message (old behavior)
word-detect-blur: true
word-detect: '&cThe word &7%word% &cis banned from the server!'
word-detect-staff: '&c[Filter] &7%name%: &c[&7%message%&c]'
word-detect-alert-staff: true
detect-alert-staff-permission: 'sc.alert.staff'

# ==================================================
# CHAT & COMMAND DELAYS
# ==================================================

# to disable chat delays, set 'chat-delay' to 0
chat-delay: 1 # how long should SupremeChat stop the player from chatting for? in seconds.
chat-warn: '&cPlease slow down, you''re chatting too fast...'
# Set to false to silently block messages (no warning sent to player)
# Cooldown will still work, but player won't see any message
chat-warn-enabled: true

caps-lowercase: true # changes caps to lowercase
caps-limit: 4 # how many caps should be limited until it detects.
disable-caps-warn: false # set true if you want to disable 'caps-warn'
caps-warn: '&cPlease do not use CAPS!'

repeat-enable: true
repeat-warn: '&cPlease do not repeat the same messages.'

# to disable command delays, set 'command-delay' to 0
command-delay: 1 # in seconds
command-warn: '&cPlease slow down, you''re executing commands too fast...'
# Set to false to silently block commands (no warning sent to player)
# Cooldown will still work, but player won't see any message
command-warn-enabled: true

# ==================================================
# DEATH MESSAGES
#
# placeholders:
# %name% = victims name that died.
# %killer% = killers name (Player)
# %mob% = mobs name that killed the victim.
# ==================================================

death:
  # set false to disable custom death messages.
  enable: true
  # edit custom death messages.
  messages:
    contact: "&c&lDEATH! &7%name% was slain!"
    entity_attack: "&c&lDEATH! &7%name% was killed by a %mob%"
    entity_player: "&c&lDEATH! &f%name% &7was killed by &c%killer%"
    fall: "&c&lDEATH! &7%name% fell from a high place."
    drowning: "&c&lDEATH! &7%name% drowned."
    fire: "&c&lDEATH! &7%name% burned to death."
    projectile: "&c&lDEATH! &7%name% was shot."
    unknown: "&c&lDEATH! &7%name% died mysteriously."

# ==================================================
# COMMAND-SPY
# ==================================================

enable-command-spy: true
cs-spy: '&c[Command-Spy] &7%name%: &f/%command%'
whitelist-spy-commands:
  - 'spawn'

# ==================================================
# LOGGING
#
# SupremeChat writes log files into: plugins/SupremeChat/logs/
#   - chat/<date>.log     -> chat messages
#   - commands/<date>.log -> commands
# ==================================================
logging:
  # log every chat message players send to logs/chat/<date>.log
  # set false to disable chat logging completely.
  # (blocked messages are still logged, tagged with a reason e.g. (BANNED WORD))
  chat: true
  # log every command players run to logs/commands/<date>.log
  # set false to disable command logging completely.
  commands: true

# ==================================================
# INTERACTIONS CHAT:
# ==================================================

# item in chat settings
enable-chat-item: true
chat-item-strings: # message string that will grab the item the player is holding.
  - '[i]'
  - '[item]'
chat-item-replace: '&8[&b%item%&8]' # this will be the message that will replace the item string.

# ==================================================
# CHAT GAMES:
# ==================================================
# trivia & maths game values are divided into "<question/equation>:<answer>"

chatgames:
  enable: true # weather or not you want chat games to be enabled.
  interval-seconds: 180 # how many seconds a new game to start, won't start a new one if one is running.
  min-players: 2 # minimum players needed for a game to start.
  expiry-time: 30 # how many seconds a game lasts before expiring
  strings:
    game-announce:
      - '&8&m------------------------------------------'
      - '                     &c&lC&6&lH&e&lA&a&lT&b&l &9&lG&d&lA&5&lM&c&lE&6&lS'
      - ''
      - '&7Game: &b%game_name%'
      - '&7Prompt: &f%game_question%'
      - ''
      - '&8&m------------------------------------------'
    game-win: '&c&lC&6&lH&e&lA&a&lT&b&l &9&lG&d&lA&5&lM&c&lE&6&lS &8&l➟ &a%player% &7won the game!'
    game-expired: '&c&lCHAT GAMES &8&l➟ &7Time is up! The answer was: %answer%'
  # word unscrambler
  word-unscrambler:
    enabled: true
    name: 'Word Unscrambler'
    reward-commands:
      - 'eco give %player% 25'
    words:
      - apple
      - banana
      - minecraft
  # trivia game
  trivia:
    enabled: true
    name: 'Trivia'
    reward-commands:
      - 'eco give %player% 25'
    questions:
      - "What is the capital of France?:Paris"
      - "Who created Minecraft?:Notch"
  # maths game
  math:
    enabled: true
    name: 'Math Game'
    reward-commands:
      - 'eco give %player% 25'
    equations:
      - "5 + 3:8"
      - "12 - 4:8"
      - "6 * 6:36"

