#   - CHATHEAD_CONFIG_GUIDE.md (detailed configuration guide)
#   - CHATHEAD_INTEGRATION_GUIDE.md (code examples)
#   - OFFLINE_MODE_EXPLANATION.md (offline mode technical details)
#   - RESOURCEPACK_SETUP_GUIDE.md (resource pack hosting and setup)
